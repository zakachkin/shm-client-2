<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SHM Client</title>
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="icon" type="image/x-icon" sizes="48x48" href="favicon.ico" />
    <meta name="description" content="Powerful and flexible client for SHM" />
    <meta property="og:title" content="SHM Client" />
    <meta property="og:description" content="Powerful and flexible client for SHM" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="favicon.jpg" />
    <style>
      #shm-boot-screen {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #ffffff;
        color: #1f2937;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #shm-boot-card {
        width: 100%;
        max-width: 420px;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 12px 36px rgba(15, 23, 42, 0.12);
      }

      #shm-boot-title {
        margin: 0 0 8px;
        font-size: 18px;
        font-weight: 700;
      }

      #shm-boot-text {
        margin: 0 0 12px;
        font-size: 14px;
        line-height: 1.45;
        color: #4b5563;
      }

      #shm-boot-details {
        margin: 0 0 12px;
        padding: 12px;
        max-height: 220px;
        overflow: auto;
        border-radius: 10px;
        background: #f3f4f6;
        color: #374151;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 12px;
        line-height: 1.4;
      }

      #shm-boot-reload {
        width: 100%;
        height: 40px;
        border: 0;
        border-radius: 10px;
        background: #06b6d4;
        color: white;
        font-size: 14px;
        font-weight: 600;
      }
    </style>
    <script>
      (() => {
        const bootTimeoutMs = 7000;
        const logPrefix = '[SHM boot]';
        const startedAt = Date.now();

        const log = (...args) => console.log(logPrefix, ...args);
        const warn = (...args) => console.warn(logPrefix, ...args);

        let lastReason = 'initial boot';
        let lastDetails = null;

        const writeBootScreen = (title, text, details) => {
          const screen = document.getElementById('shm-boot-screen');
          const titleElement = document.getElementById('shm-boot-title');
          const textElement = document.getElementById('shm-boot-text');
          const detailsElement = document.getElementById('shm-boot-details');

          if (!screen || !titleElement || !textElement || !detailsElement) return;

          screen.style.display = 'flex';
          titleElement.textContent = title;
          textElement.textContent = text;
          detailsElement.textContent = JSON.stringify(details, null, 2);
        };

        const showBootScreen = (reason, details) => {
          writeBootScreen(
            'Загрузка личного кабинета',
            'Автоперезагрузка отключена, чтобы Safari не уходил в ошибку. Ниже данные диагностики.',
            {
              reason,
              details,
              secondsFromStart: Math.round((Date.now() - startedAt) / 1000),
              href: window.location.href,
              userAgent: navigator.userAgent,
            },
          );
        };

        const hideBootScreen = () => {
          const screen = document.getElementById('shm-boot-screen');
          if (screen) {
            screen.style.display = 'none';
          }
        };

        window.__shmAppBootLoaded = false;
        window.__shmManualReload = () => {
          try {
            const url = new URL(window.location.href);
            url.searchParams.set('_shm_manual_reload', String(Date.now()));
            window.location.replace(url.toString());
          } catch (_) {
            window.location.reload();
          }
        };

        window.__shmAppBootOk = () => {
          window.__shmAppBootLoaded = true;
          log('app boot success', {
            href: window.location.href,
          });

          hideBootScreen();

          try {
            const url = new URL(window.location.href);
            if (url.searchParams.has('_shm_manual_reload') || url.searchParams.has('_shm_reload')) {
              url.searchParams.delete('_shm_manual_reload');
              url.searchParams.delete('_shm_reload');
              window.history.replaceState({}, '', `${url.pathname}${url.search}${url.hash}`);
              log('removed boot reload params from url');
            }
          } catch (_) {
          }
        };

        log('boot guard started without auto reload', {
          bootTimeoutMs,
          href: window.location.href,
          userAgent: navigator.userAgent,
        });

        window.addEventListener('error', (event) => {
          const target = event.target;
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
            lastReason = 'asset load error';
            lastDetails = {
              tagName: target.tagName,
              src: target.src || target.href || null,
            };
            warn('asset load error captured', lastDetails);
            showBootScreen(lastReason, lastDetails);
            return;
          }

          lastReason = 'javascript runtime error';
          lastDetails = {
            message: event.message || null,
            filename: event.filename || null,
            lineno: event.lineno || null,
            colno: event.colno || null,
          };
          warn('runtime error captured', lastDetails);
          showBootScreen(lastReason, lastDetails);
        }, true);

        window.addEventListener('unhandledrejection', (event) => {
          const message = String(event.reason?.message || event.reason || '');
          lastReason = 'unhandled promise rejection';
          lastDetails = { message };
          warn('unhandled promise rejection captured', lastDetails);
          showBootScreen(lastReason, lastDetails);
        });

        window.setTimeout(() => {
          if (!window.__shmAppBootLoaded) {
            showBootScreen('boot timeout', {
              timeoutMs: bootTimeoutMs,
              rootHasContent: Boolean(document.getElementById('root')?.childElementCount),
              lastReason,
              lastDetails,
            });
          } else {
            log('boot timeout check passed, app already booted');
          }
        }, bootTimeoutMs);
      })();
    </script>
    <script>
      (() => {
        const telegramLaunch = `${window.location.search}${window.location.hash}`.includes('tgWebAppData=')
          || /Telegram/i.test(navigator.userAgent);

        if (telegramLaunch) {
          document.write('<script src="telegram-web-app-56-min.js"><\\/script>');
        }
      })();
    </script>
    <script src="config.js"></script>
  </head>
  <body>
    <div id="shm-boot-screen">
      <div id="shm-boot-card">
        <h1 id="shm-boot-title">Загрузка личного кабинета</h1>
        <p id="shm-boot-text">Проверяем запуск приложения…</p>
        <pre id="shm-boot-details">{
  "version": "manual-diagnostics-no-auto-reload",
  "hint": "Если этот блок не исчезает, основной JS не стартовал или приложение упало."
}</pre>
        <button id="shm-boot-reload" type="button" onclick="window.__shmManualReload && window.__shmManualReload()">Обновить страницу</button>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="src/main.tsx"></script>
  </body>
</html>
